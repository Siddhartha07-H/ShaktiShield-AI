version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: shaktishield-postgres
    restart: always
    environment:
      POSTGRES_USER: shaktishield_user
      POSTGRES_PASSWORD: shaktishield_password
      POSTGRES_DB: shaktishield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaktishield_user -d shaktishield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shaktishield-backend
    restart: always
    environment:
      DATABASE_URL: "postgresql+psycopg2://shaktishield_user:shaktishield_password@db:5432/shaktishield_db"
      JWT_SECRET: "shaktishield-docker-compose-secret-key-2026"
      DEMO_MODE: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shaktishield-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
